<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civilian Shield</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#050a0f; font-family:'Exo 2',sans-serif; min-height:100vh; }
        body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,207,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,207,255,0.04) 1px,transparent 1px); background-size:30px 30px; z-index:0; }
        .app { position:relative; z-index:1; max-width:420px; margin:0 auto; padding:20px; min-height:100vh; padding-bottom:100px; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; margin-bottom:24px; }
        .logo { font-family:'Orbitron',monospace; font-size:18px; font-weight:900; background:linear-gradient(135deg,#00cfff,#00ff88); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .status-dot { display:flex; align-items:center; gap:6px; font-size:11px; color:#00ff88; font-family:monospace; }
        .dot-live { width:8px; height:8px; border-radius:50%; background:#00ff88; box-shadow:0 0 8px #00ff88; animation:blink 1.5s infinite; }
        @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
        .threat-card { background:#0a1420; border:1px solid rgba(0,207,255,0.2); border-radius:16px; padding:20px; margin-bottom:16px; }
        .threat-label { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:3px; color:rgba(0,207,255,0.6); margin-bottom:12px; }
        .threat-level { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
        .threat-value { font-family:'Orbitron',monospace; font-size:36px; font-weight:900; color:#ffd000; }
        .threat-status { background:rgba(255,208,0,0.15); border:1px solid rgba(255,208,0,0.3); color:#ffd000; font-size:11px; padding:6px 12px; border-radius:20px; }
        .threat-bar { height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden; }
        .threat-fill { height:100%; width:42%; background:linear-gradient(90deg,#00ff88,#ffd000); border-radius:4px; transition:width 1s; }
        .section-title { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:3px; color:rgba(0,207,255,0.5); margin-bottom:14px; margin-top:20px; }
        .threat-item { background:#0a1420; border:1px solid rgba(0,207,255,0.12); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; transition:all 0.2s; }
        .threat-item:hover { border-color:rgba(0,207,255,0.3); }
        .sev { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .sev-HIGH { background:#ff2d2d; box-shadow:0 0 8px #ff2d2d; }
        .sev-MEDIUM { background:#ffd000; box-shadow:0 0 8px #ffd000; }
        .sev-LOW { background:#00ff88; box-shadow:0 0 8px #00ff88; }
        .threat-info { flex:1; }
        .threat-info h4 { font-size:13px; color:#fff; font-weight:600; margin-bottom:2px; }
        .threat-info p { font-size:11px; color:rgba(255,255,255,0.4); }
        .threat-time { font-size:11px; color:rgba(255,255,255,0.3); font-family:monospace; }
        .sos-container { display:flex; justify-content:center; margin:24px 0; }
        .sos-btn { width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(255,45,45,0.3),rgba(255,45,45,0.1)); border:3px solid #ff2d2d; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; box-shadow:0 0 30px rgba(255,45,45,0.3); transition:all 0.2s; }
        .sos-btn:hover { transform:scale(1.05); box-shadow:0 0 50px rgba(255,45,45,0.5); }
        .sos-btn::before { content:''; position:absolute; inset:-10px; border-radius:50%; border:1px solid rgba(255,45,45,0.3); animation:sosPulse 2s infinite; }
        .sos-btn::after { content:''; position:absolute; inset:-20px; border-radius:50%; border:1px solid rgba(255,45,45,0.15); animation:sosPulse 2s infinite 0.5s; }
        @keyframes sosPulse { 0%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0} }
        .sos-text { font-family:'Orbitron',monospace; font-size:28px; font-weight:900; color:#ff2d2d; }
        .sos-sub { font-size:10px; color:rgba(255,255,255,0.5); margin-top:2px; }
        .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
        .action-btn { background:#0a1420; border:1px solid rgba(0,207,255,0.2); border-radius:14px; padding:18px 14px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; cursor:pointer; transition:all 0.3s; }
        .action-btn:hover { border-color:#00cfff; background:rgba(0,207,255,0.08); transform:translateY(-2px); }
        .action-btn .icon { font-size:24px; }
        .action-btn .name { font-size:13px; font-weight:600; color:#fff; }
        .action-btn .desc { font-size:11px; color:rgba(255,255,255,0.4); line-height:1.3; }
        .profile-card { background:#0a1420; border:1px solid rgba(0,207,255,0.2); border-radius:16px; padding:24px; margin-bottom:16px; }
        .profile-avatar { width:70px; height:70px; border-radius:50%; background:linear-gradient(135deg,#00cfff,#00ff88); display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:16px; }
        .profile-name { font-family:'Orbitron',monospace; font-size:16px; color:#fff; margin-bottom:4px; }
        .profile-status { color:#00ff88; font-size:12px; margin-bottom:16px; }
        .profile-stat { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(0,207,255,0.08); font-size:13px; }
        .profile-stat:last-child { border-bottom:none; }
        .profile-stat span:first-child { color:rgba(255,255,255,0.5); }
        .profile-stat span:last-child { color:#fff; font-weight:600; }
        #map { height:350px; border-radius:16px; border:1px solid rgba(0,207,255,0.3); margin-bottom:16px; z-index:1; }
        .map-stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
        .map-stat { background:#0a1420; border:1px solid rgba(0,207,255,0.2); border-radius:12px; padding:16px; text-align:center; }
        .map-stat .stat-value { font-family:'Orbitron',monospace; font-size:24px; font-weight:900; color:#00cfff; }
        .map-stat .stat-label { font-size:11px; color:rgba(255,255,255,0.4); margin-top:4px; }
        .loading { color:rgba(255,255,255,0.4); font-size:13px; text-align:center; padding:20px; }
        .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:420px; background:rgba(5,10,15,0.97); border-top:1px solid rgba(0,207,255,0.15); padding:12px 0 20px; display:flex; justify-content:space-around; backdrop-filter:blur(20px); z-index:100; }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; opacity:0.4; transition:all 0.2s; }
        .nav-item.active { opacity:1; }
        .nav-icon { font-size:22px; }
        .nav-label { font-size:10px; color:#00cfff; font-family:monospace; letter-spacing:1px; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:none; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
        .modal-overlay.show { display:flex; }
        .modal { background:#0a1420; border:1px solid rgba(255,45,45,0.5); border-radius:20px; padding:32px 24px; max-width:320px; width:90%; text-align:center; box-shadow:0 0 60px rgba(255,45,45,0.3); }
        .modal h2 { font-family:'Orbitron',monospace; color:#ff2d2d; font-size:22px; margin-bottom:12px; }
        .modal p { color:rgba(255,255,255,0.6); font-size:14px; margin-bottom:24px; line-height:1.6; }
        .modal-btns { display:flex; gap:12px; }
        .btn-confirm { flex:1; padding:14px; background:#ff2d2d; border:none; border-radius:10px; color:#fff; font-family:'Orbitron',monospace; font-size:14px; font-weight:700; cursor:pointer; }
        .btn-cancel { flex:1; padding:14px; background:transparent; border:1px solid rgba(255,255,255,0.2); border-radius:10px; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; }
        .logout-btn { width:100%; padding:14px; background:transparent; border:1px solid rgba(255,45,45,0.4); border-radius:10px; color:#ff4444; font-family:'Orbitron',monospace; font-size:13px; cursor:pointer; margin-top:12px; transition:all 0.3s; }
        .logout-btn:hover { background:rgba(255,45,45,0.1); }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">🛡️ C.SHIELD</div>
        <div class="status-dot"><div class="dot-live"></div>LIVE</div>
    </div>
    <div id="pageContent"></div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="showPage('home',this)"><div class="nav-icon">🏠</div><div class="nav-label">HOME</div></div>
    <div class="nav-item" id="nav-map" onclick="showPage('map',this)"><div class="nav-icon">🗺️</div><div class="nav-label">MAP</div></div>
    <div class="nav-item" id="nav-alerts" onclick="showPage('alerts',this)"><div class="nav-icon">🔔</div><div class="nav-label">ALERTS</div></div>
    <div class="nav-item" id="nav-profile" onclick="showPage('profile',this)"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></div>
</div>

<!-- SOS MODAL -->
<div class="modal-overlay" id="sosModal">
    <div class="modal">
        <h2>🆘 SEND SOS?</h2>
        <p>This will immediately alert NDRF, Red Cross, local police and your family with your location.</p>
        <div class="modal-btns">
            <button class="btn-confirm" onclick="confirmSOS()">SEND NOW</button>
            <button class="btn-cancel" onclick="closeModal('sosModal')">Cancel</button>
        </div>
    </div>
</div>

<script>
    let allThreats = [];
    let userLat = 20.5937;
    let userLng = 78.9629;
    let mapInstance = null;

    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
        });
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    function showPage(page, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(el) el.classList.add('active');
        closeModal('sosModal');
        const content = document.getElementById('pageContent');
        mapInstance = null;

        if(page === 'home') {
            content.innerHTML = `
                <div class="threat-card">
                    <div class="threat-label">AREA THREAT LEVEL</div>
                    <div class="threat-level">
                        <div class="threat-value" id="threatPercent">42%</div>
                        <div class="threat-status" id="threatStatus">MODERATE</div>
                    </div>
                    <div class="threat-bar"><div class="threat-fill" id="threatBar" style="width:42%"></div></div>
                </div>
                <div class="section-title">QUICK ACTIONS</div>
                <div class="action-grid">
                    <div class="action-btn" onclick="safeRoute()">
                        <div class="icon">🗺️</div><div class="name">Safe Route</div><div class="desc">Find evacuation path</div>
                    </div>
                    <div class="action-btn" onclick="familyLocation()">
                        <div class="icon">👨‍👩‍👧</div><div class="name">Family</div><div class="desc">Share location on WhatsApp</div>
                    </div>
                    <div class="action-btn" onclick="offlineMode()">
                        <div class="icon">📡</div><div class="name">Offline</div><div class="desc">Enable mesh network</div>
                    </div>
                    <div class="action-btn" onclick="nearbyHospitals()">
                        <div class="icon">🏥</div><div class="name">Hospitals</div><div class="desc">Nearest safe facilities</div>
                    </div>
                </div>
                <div class="sos-container">
                    <div class="sos-btn" onclick="document.getElementById('sosModal').classList.add('show')">
                        <div class="sos-text">SOS</div>
                        <div class="sos-sub">TAP TO SEND</div>
                    </div>
                </div>
                <div class="section-title">LIVE THREATS FROM DATABASE</div>
                <div id="threatList"><div class="loading">Loading threats...</div></div>
            `;
            loadThreats();
            loadLevel();
        }

        else if(page === 'alerts') {
            content.innerHTML = `
                <div class="section-title">ALL ACTIVE ALERTS</div>
                <div id="alertList"><div class="loading">Loading alerts...</div></div>
            `;
            loadAlerts();
        }

        else if(page === 'map') {
            content.innerHTML = `
                <div class="section-title">THREAT MAP — INDIA</div>
                <div class="map-stats">
                    <div class="map-stat"><div class="stat-value" id="totalThreats">${allThreats.length}</div><div class="stat-label">ACTIVE THREATS</div></div>
                    <div class="map-stat"><div class="stat-value">142</div><div class="stat-label">RESPONDERS ONLINE</div></div>
                    <div class="map-stat"><div class="stat-value">4 min</div><div class="stat-label">AVG RESPONSE</div></div>
                    <div class="map-stat"><div class="stat-value" style="color:#00ff88">LIVE</div><div class="stat-label">SYSTEM STATUS</div></div>
                </div>
                <div id="map"></div>
                <div class="section-title">THREAT LOCATIONS</div>
                <div id="mapThreatList"><div class="loading">Loading...</div></div>
            `;
            setTimeout(() => initMap(), 200);
            loadMapThreats();
        }

        else if(page === 'profile') {
            const name = localStorage.getItem('userName') || 'Civilian User';
            const location = localStorage.getItem('userLocation') || 'India';
            content.innerHTML = `
                <div class="section-title">MY PROFILE</div>
                <div class="profile-card">
                    <div class="profile-avatar">👤</div>
                    <div class="profile-name">${name.toUpperCase()}</div>
                    <div class="profile-status">🟢 STATUS: SAFE</div>
                    <div class="profile-stat"><span>📍 Location</span><span>${location}</span></div>
                    <div class="profile-stat"><span>🔔 Alerts Received</span><span>5</span></div>
                    <div class="profile-stat"><span>🛡️ Protected Since</span><span>Today</span></div>
                    <div class="profile-stat"><span>📡 Mesh Network</span><span>Active</span></div>
                    <div class="profile-stat"><span>🆘 SOS Ready</span><span style="color:#00ff88">YES</span></div>
                </div>
                <div class="section-title">MY FAMILY</div>
                <div class="threat-item">
                    <div style="font-size:24px">👨</div>
                    <div class="threat-info"><h4>Family Member 1</h4><p>🟢 Safe — Last seen 5 mins ago</p></div>
                </div>
                <div class="threat-item">
                    <div style="font-size:24px">👩</div>
                    <div class="threat-info"><h4>Family Member 2</h4><p>🟢 Safe — Last seen 12 mins ago</p></div>
                </div>
                <div class="section-title">ACCOUNT</div>
                <div class="profile-card">
                    <div class="profile-stat"><span>📧 Email</span><span style="font-size:11px">${localStorage.getItem('userEmail') || 'user@email.com'}</span></div>
                    <div class="profile-stat" style="cursor:pointer" onclick="forgotPassword()"><span>🔑 Change Password</span><span style="color:#00cfff">→</span></div>
                </div>
                <button class="logout-btn" onclick="logout()">🚪 LOGOUT</button>
            `;
        }
    }

    function initMap() {
        const mapEl = document.getElementById('map');
        if(!mapEl || mapInstance) return;
        mapInstance = L.map('map').setView([userLat, userLng], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(mapInstance);
        const userIcon = L.divIcon({
            html: '<div style="background:#00cfff;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px #00cfff"></div>',
            iconSize:[16,16], className:''
        });
        L.marker([userLat, userLng], {icon: userIcon})
            .addTo(mapInstance)
            .bindPopup('📍 You are here')
            .openPopup();
        allThreats.forEach(t => {
            if(t.lat && t.lng) {
                const color = t.severity==='HIGH'?'#ff2d2d':t.severity==='MEDIUM'?'#ffd000':'#00ff88';
                const icon = L.divIcon({
                    html: `<div style="background:${color};width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 8px ${color}"></div>`,
                    iconSize:[14,14], className:''
                });
                L.marker([t.lat, t.lng], {icon})
                    .addTo(mapInstance)
                    .bindPopup(`⚠️ ${t.title}<br>📍 ${t.location}`);
            }
        });
    }

    function safeRoute() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                window.open(`https://www.google.com/maps/dir/${pos.coords.latitude},${pos.coords.longitude}/hospital`, '_blank');
            }, () => {
                window.open('https://www.google.com/maps/search/safe+route', '_blank');
            });
        } else {
            window.open('https://www.google.com/maps/search/safe+route', '_blank');
        }
    }

    function nearbyHospitals() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                window.open(`https://www.google.com/maps/search/hospitals/@${pos.coords.latitude},${pos.coords.longitude},14z`, '_blank');
            }, () => {
                window.open('https://www.google.com/maps/search/hospitals+near+me', '_blank');
            });
        } else {
            window.open('https://www.google.com/maps/search/hospitals+near+me', '_blank');
        }
    }

    function familyLocation() {
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                const message = `🛡️ CivilianShield Alert!\n\nI want to share my location with you.\n\n📍 My Location: ${mapsLink}\n\nStay Safe! - Sent via CivilianShield`;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
            }, () => {
                const message = `🛡️ CivilianShield Alert!\n\nPlease check on me!\n\nStay Safe! - Sent via CivilianShield`;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
            });
        } else {
            const message = `🛡️ CivilianShield Alert!\n\nPlease check on me!\n\nStay Safe!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
        }
    }

    function offlineMode() {
        alert('📡 Offline Mode\n\nOffline mesh network allows CivilianShield to work without internet by connecting nearby devices via Bluetooth.\n\nComing in v2.0!');
    }

    function forgotPassword() {
        const email = prompt('Enter your registered email address:');
        if(!email) return;
        fetch('/api/user/forgot-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: email})
        }).then(r => r.json()).then(data => {
            alert(data.message || 'Password reset email sent!');
        }).catch(() => {
            alert('Reset email sent if account exists!');
        });
    }

    function logout() {
        if(confirm('Are you sure you want to logout?')) {
            localStorage.clear();
            window.location.href = '/login.html';
        }
    }

    async function loadThreats() {
        try {
            const res = await fetch('/api/threats');
            allThreats = await res.json();
            const list = document.getElementById('threatList');
            if(!list) return;
            if(allThreats.length === 0) {
                list.innerHTML = '<div class="loading">No threats reported — Area is safe ✅</div>';
                return;
            }
            list.innerHTML = allThreats.map(t => `
                <div class="threat-item">
                    <div class="sev sev-${t.severity}"></div>
                    <div class="threat-info">
                        <h4>${t.title}</h4>
                        <p>${t.distance||''} ${t.location}</p>
                    </div>
                    <div class="threat-time">${t.time||''}</div>
                </div>
            `).join('');
        } catch(e) {
            const list = document.getElementById('threatList');
            if(list) list.innerHTML = '<div class="loading">No threats — Area is safe ✅</div>';
        }
    }

    async function loadAlerts() {
        try {
            const res = await fetch('/api/threats');
            const threats = await res.json();
            const list = document.getElementById('alertList');
            if(!list) return;
            if(threats.length === 0) {
                list.innerHTML = '<div class="loading">No active alerts — All clear ✅</div>';
                return;
            }
            list.innerHTML = threats.map(t => `
                <div class="threat-item">
                    <div class="sev sev-${t.severity}"></div>
                    <div class="threat-info">
                        <h4>${t.title}</h4>
                        <p>📍 ${t.location} ${t.distance?'• '+t.distance+' away':''}</p>
                        <p style="color:${t.severity==='HIGH'?'#ff2d2d':t.severity==='MEDIUM'?'#ffd000':'#00ff88'};margin-top:4px;font-size:11px">⚠️ ${t.severity} SEVERITY</p>
                    </div>
                    <div class="threat-time">${t.time||''}</div>
                </div>
            `).join('');
        } catch(e) {}
    }

    async function loadMapThreats() {
        try {
            const list = document.getElementById('mapThreatList');
            if(!list) return;
            if(allThreats.length === 0) {
                list.innerHTML = '<div class="loading">No threats on map</div>';
                return;
            }
            list.innerHTML = allThreats.map(t => `
                <div class="threat-item">
                    <div style="font-size:20px">${t.severity==='HIGH'?'🔴':t.severity==='MEDIUM'?'🟡':'🟢'}</div>
                    <div class="threat-info">
                        <h4>${t.title}</h4>
                        <p>📍 ${t.location} ${t.distance?'• '+t.distance:''}</p>
                    </div>
                </div>
            `).join('');
        } catch(e) {}
    }

    async function loadLevel() {
        try {
            const res = await fetch('/api/threats/level');
            const level = await res.json();
            const p = document.getElementById('threatPercent');
            const s = document.getElementById('threatStatus');
            const b = document.getElementById('threatBar');
            if(p) p.textContent = level.percentage + '%';
            if(s) s.textContent = level.status;
            if(b) b.style.width = level.percentage + '%';
        } catch(e) {}
    }

    function confirmSOS() {
        closeModal('sosModal');
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                const message = `🆘 SOS ALERT!\n\nI need help immediately!\n\n📍 My Location: ${mapsLink}\n\n- Sent via CivilianShield`;
                window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
                fetch('/api/sos', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({location: lat+','+lng, name: localStorage.getItem('userName')||'User'})
                });
            });
        }
        alert('🆘 SOS SENT!\n\n✅ NDRF Notified\n✅ Red Cross India Notified\n✅ Local Police Notified\n✅ Family Notified via WhatsApp\n\nHelp is on the way. Stay safe!');
    }

    showPage('home', document.getElementById('nav-home'));
    setInterval(loadThreats, 30000);
</script>
</body>
</html>
